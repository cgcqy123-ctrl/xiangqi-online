<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2a1a0e" />
<title>中国象棋 · 联机版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟️</text></svg>" />
<link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
<div id="app">

  <!-- ============ 首页 ============ -->
  <section class="screen" id="scr-home">
    <div class="home">
      <h1 class="logo">中国象棋</h1>
      <p class="sub">联机版 · 双人对弈 · 无需注册</p>

      <label class="field">
        <span>昵称</span>
        <input id="in-name" maxlength="8" placeholder="给自己起个名字" autocomplete="off" />
      </label>
      <button class="btn primary block" id="btn-create">创建房间</button>

      <div class="divider"><span>或者加入好友的房间</span></div>

      <label class="field">
        <span>房号</span>
        <input id="in-code" maxlength="4" placeholder="4 位房号" autocomplete="off" autocapitalize="characters" />
      </label>
      <button class="btn block" id="btn-join">加入房间</button>

      <p class="tip">创建房间拿到房号，把房号发给朋友，输入房号即可入座。两人到齐由房主开局，第 3 位起自动成为观战。</p>
    </div>
  </section>

  <!-- ============ 房间 ============ -->
  <section class="screen hidden" id="scr-lobby">
    <div class="lobby">
      <div class="code-badge">房号 <b id="lobby-code">----</b></div>
      <ul class="seat-list" id="seat-list"></ul>
      <p class="spec-line" id="lobby-spec"></p>
      <button class="btn primary block" id="btn-start" disabled>开始对局</button>
      <p class="tip" id="lobby-tip"></p>
      <button class="btn ghost block" id="btn-leave">离开房间</button>
    </div>
  </section>

  <!-- ============ 棋桌 ============ -->
  <section class="screen hidden" id="scr-table">
    <div class="table">
      <header class="topbar">
        <span class="pill">房号 <b id="t-code">----</b></span>
        <span class="pill" id="t-room">红方 vs 黑方</span>
        <button class="btn tiny ghost" id="btn-menu">菜单</button>
      </header>

      <div class="players" id="t-players"></div>

      <div class="arena">
        <div class="board-box" id="board-box">
          <div class="board" id="board">
            <div class="grid" id="board-grid"></div>
            <div class="check-banner hidden" id="check-banner">将军！</div>
            <div class="overlay hidden" id="overlay"><div class="panel" id="overlay-panel"></div></div>
          </div>
        </div>

        <aside class="side" id="side">
          <div class="tabs">
            <button class="tab active" id="tab-moves" data-tab="moves">棋谱</button>
            <button class="tab" id="tab-chat" data-tab="chat">聊天</button>
            <span class="spec-count" id="side-spec"></span>
          </div>
          <ol class="moves" id="move-list"></ol>
          <div class="chat hidden" id="chat-pane">
            <div class="chat-log" id="chat-log"></div>
            <div class="quick" id="quick"></div>
            <form class="chat-form" id="chat-form">
              <input id="chat-input" maxlength="60" placeholder="说点什么…" autocomplete="off" />
              <button class="btn tiny primary" type="submit">发送</button>
            </form>
          </div>
        </aside>
      </div>

      <div class="offer-bar hidden" id="offer-bar"></div>
      <div class="actionbar" id="actions"></div>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script src="js/vendor/peerjs.min.js"></script>
<script type="module" src="js/main.js?v=3"></script>
</body>
</html>
